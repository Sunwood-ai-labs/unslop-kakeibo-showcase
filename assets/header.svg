<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="1200" height="380" fill="none">
  <defs>
    <pattern id="grid4px" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#222226" stroke-width="1" />
    </pattern>
  </defs>

  <!-- Canvas Background -->
  <rect width="1200" height="380" rx="16" fill="#0f0f10" />
  <rect x="1" y="1" width="1198" height="378" rx="15" fill="url(#grid4px)" opacity="0.65" />
  <rect x="1" y="1" width="1198" height="378" rx="15" stroke="#2a2a2e" stroke-width="2" />

  <!-- Top Telemetry / Swiss Structural Rule -->
  <line x1="0" y1="48" x2="1200" y2="48" stroke="#26262a" stroke-width="1" />
  <circle cx="28" cy="24" r="4" fill="#ff5c28" />
  <text x="44" y="28" fill="#a0a0a8" font-family="'JetBrains Mono', 'IBM Plex Mono', monospace" font-size="11" letter-spacing="1.5">UNSLOP SKILL VERIFICATION SHOWCASE · 5-LINE DIRECTION × 9 PASSES</text>
  <text x="1172" y="28" fill="#71717a" font-family="'JetBrains Mono', 'IBM Plex Mono', monospace" font-size="11" text-anchor="end">100% JAPANESE CRAFT UI</text>

  <!-- Left Column: Brand Mark & Typography -->
  <g transform="translate(48, 84)">
    <!-- Mini Masu Emblem -->
    <rect x="0" y="0" width="52" height="52" rx="12" fill="#19191b" stroke="#323238" stroke-width="1.5" />
    <rect x="8" y="8" width="16" height="16" rx="3" fill="#27272c" stroke="#ededef" stroke-width="1.2" />
    <rect x="28" y="8" width="16" height="16" rx="3" fill="#1b5e43" />
    <rect x="8" y="28" width="16" height="16" rx="3" fill="#ff5c28" />
    <rect x="28" y="28" width="16" height="16" rx="3" fill="#d9381e" />

    <!-- Eyebrow Badge -->
    <rect x="68" y="4" width="236" height="24" rx="6" fill="#19191b" stroke="#2e2e34" stroke-width="1" />
    <text x="80" y="20" fill="#d4d4d8" font-family="'JetBrains Mono', monospace" font-size="11">heydamir/unslop · CC BY 4.0</text>

    <!-- Main Headline -->
    <text x="0" y="102" fill="#f4f4f6" font-family="'Inter', 'Plus Jakarta Sans', 'Noto Sans JP', sans-serif" font-size="36" font-weight="500" letter-spacing="-0.8">Masu Kakeibo Showcase</text>
    <text x="0" y="138" fill="#a1a1aa" font-family="'Inter', 'Noto Sans JP', sans-serif" font-size="17" font-weight="400">4 Kakeibo UI Concepts Built with heydamir/unslop</text>
    <text x="0" y="166" fill="#71717a" font-family="'Noto Sans JP', 'Inter', sans-serif" font-size="13" font-weight="400">AIスロップを排し、5行の設計指針と9段階の赤入れで構築した4つの家計簿UI</text>

    <!-- Keycap & Pass Pills -->
    <g transform="translate(0, 196)">
      <rect x="0" y="0" width="108" height="28" rx="6" fill="#18181b" stroke="#2e2e34" stroke-width="1" />
      <text x="12" y="18" fill="#e4e4e7" font-family="'JetBrains Mono', monospace" font-size="11">[U] X-Ray</text>

      <rect x="118" y="0" width="128" height="28" rx="6" fill="#18181b" stroke="#2e2e34" stroke-width="1" />
      <text x="130" y="18" fill="#e4e4e7" font-family="'JetBrains Mono', monospace" font-size="11">[B] Slop Diff</text>

      <rect x="256" y="0" width="116" height="28" rx="6" fill="#18181b" stroke="#2e2e34" stroke-width="1" />
      <text x="268" y="18" fill="#e4e4e7" font-family="'JetBrains Mono', monospace" font-size="11">[T] Dark/Light</text>

      <rect x="382" y="0" width="110" height="28" rx="6" fill="#18181b" stroke="#2e2e34" stroke-width="1" />
      <text x="394" y="18" fill="#e4e4e7" font-family="'JetBrains Mono', monospace" font-size="11">[N] Log Entry</text>
    </g>
  </g>

  <!-- Right Column: 4 Concept Geometric Quadrant Cards -->
  <g transform="translate(596, 72)">
    <!-- 00 MASU (#19191b) -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="272" height="128" rx="10" fill="#19191b" stroke="#323236" stroke-width="1.5" />
      <circle cx="20" cy="22" r="4" fill="#f5b82e" />
      <text x="32" y="26" fill="#a1a1aa" font-family="'JetBrains Mono', monospace" font-size="11">00 · MASU (枡)</text>
      <text x="252" y="26" fill="#71717a" font-family="'JetBrains Mono', monospace" font-size="11" text-anchor="end">#19191b</text>
      <text x="20" y="54" fill="#f4f4f5" font-family="'Inter', 'Noto Sans JP', sans-serif" font-size="15" font-weight="500">Tactile Graphite Ledger</text>
      <text x="20" y="76" fill="#8e8e96" font-family="'JetBrains Mono', monospace" font-size="12">¥248,620 · -8.4%</text>
      <!-- Mirrored Spline Motif -->
      <path d="M 20 104 C 65 86, 110 112, 160 92 C 195 78, 225 98, 252 86" stroke="#10b981" stroke-width="2" fill="none" />
      <path d="M 20 104 C 65 118, 110 96, 160 112 C 195 120, 225 104, 252 114" stroke="#52525b" stroke-width="1.5" stroke-dasharray="3 3" fill="none" />
    </g>

    <!-- 01 SHIORI (#1b5e43) -->
    <g transform="translate(288, 0)">
      <rect x="0" y="0" width="272" height="128" rx="10" fill="#1b5e43" stroke="#2d7a5b" stroke-width="1.5" />
      <!-- Hanging Ribbon Accent -->
      <path d="M 232 0 V 34 L 242 26 L 252 34 V 0 Z" fill="#f7f4ee" />
      <circle cx="20" cy="22" r="4" fill="#f7f4ee" />
      <text x="32" y="26" fill="#d1fae5" font-family="'JetBrains Mono', monospace" font-size="11">01 · SHIORI (家計栞)</text>
      <text x="218" y="26" fill="#a7f3d0" font-family="'JetBrains Mono', monospace" font-size="11" text-anchor="end">#1b5e43</text>
      <text x="20" y="54" fill="#fdfbf7" font-family="'Inter', 'Noto Sans JP', sans-serif" font-size="15" font-weight="500">Warm Botanical Archival</text>
      <text x="20" y="76" fill="#a7f3d0" font-family="'JetBrains Mono', monospace" font-size="12">Archival Paper · #f7f4ee</text>
      <!-- 6-Month Bar Motif (Oct lit) -->
      <rect x="20" y="98" width="28" height="14" rx="2" fill="#134631" />
      <rect x="56" y="94" width="28" height="18" rx="2" fill="#134631" />
      <rect x="92" y="96" width="28" height="16" rx="2" fill="#134631" />
      <rect x="128" y="90" width="28" height="22" rx="2" fill="#134631" />
      <rect x="164" y="92" width="28" height="20" rx="2" fill="#134631" />
      <rect x="200" y="84" width="36" height="28" rx="2" fill="#f7f4ee" />
    </g>

    <!-- 02 PULSE (#ff5c28) -->
    <g transform="translate(0, 144)">
      <rect x="0" y="0" width="272" height="128" rx="10" fill="#121316" stroke="#ff5c28" stroke-width="1.5" />
      <rect x="14" y="16" width="8" height="8" rx="1" fill="#ff5c28" />
      <text x="30" y="25" fill="#ffb49a" font-family="'JetBrains Mono', monospace" font-size="11">02 · PULSE (パルス)</text>
      <text x="252" y="25" fill="#ff5c28" font-family="'JetBrains Mono', monospace" font-size="11" text-anchor="end">#ff5c28</text>
      <text x="20" y="52" fill="#f4f4f6" font-family="'Inter', 'Noto Sans JP', sans-serif" font-size="15" font-weight="500">Precision Cashflow OS</text>
      <text x="20" y="74" fill="#9ca3af" font-family="'JetBrains Mono', monospace" font-size="12">31-Day Impulse Telemetry</text>
      <!-- Signal Impulse Stem Bars -->
      <g stroke="#ff5c28" stroke-width="3" stroke-linecap="round">
        <line x1="26" y1="112" x2="26" y2="96" />
        <line x1="42" y1="112" x2="42" y2="88" />
        <line x1="58" y1="112" x2="58" y2="102" stroke="#3f3f46" />
        <line x1="74" y1="112" x2="74" y2="82" />
        <line x1="90" y1="112" x2="90" y2="98" stroke="#3f3f46" />
        <line x1="106" y1="112" x2="106" y2="92" />
        <line x1="122" y1="112" x2="122" y2="78" />
        <line x1="138" y1="112" x2="138" y2="100" stroke="#3f3f46" />
        <line x1="154" y1="112" x2="154" y2="86" />
        <line x1="170" y1="112" x2="170" y2="94" />
        <line x1="186" y1="112" x2="186" y2="104" stroke="#3f3f46" />
        <line x1="202" y1="112" x2="202" y2="80" />
        <line x1="218" y1="112" x2="218" y2="90" />
        <line x1="234" y1="112" x2="234" y2="96" />
        <line x1="250" y1="112" x2="250" y2="84" />
      </g>
    </g>

    <!-- 03 TOKONOMA (#d9381e) -->
    <g transform="translate(288, 144)">
      <rect x="0" y="0" width="272" height="128" rx="10" fill="#f4f3ef" stroke="#d9381e" stroke-width="1.5" />
      <!-- Exposed 1px Swiss Grid Lines -->
      <line x1="0" y1="36" x2="272" y2="36" stroke="#d6d3cd" stroke-width="1" />
      <line x1="176" y1="36" x2="176" y2="128" stroke="#d6d3cd" stroke-width="1" />
      <line x1="176" y1="84" x2="272" y2="84" stroke="#d6d3cd" stroke-width="1" />
      <circle cx="20" cy="19" r="4" fill="#d9381e" />
      <text x="32" y="23" fill="#18181b" font-family="'JetBrains Mono', monospace" font-size="11">03 · TOKONOMA (床の間)</text>
      <text x="252" y="23" fill="#d9381e" font-family="'JetBrains Mono', monospace" font-size="11" text-anchor="end">#d9381e</text>
      <text x="18" y="64" fill="#18181b" font-family="'Inter', 'Noto Sans JP', sans-serif" font-size="15" font-weight="500">Editorial Swiss Grid</text>
      <text x="18" y="88" fill="#52525b" font-family="'JetBrains Mono', monospace" font-size="12">1px Hairline · Treemap</text>
